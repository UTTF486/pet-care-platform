server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: pet-care-server

  # ===================================================================
  # 敏感信息处理约定（提交到 GitHub 也不会泄露密码）
  #
  # 本文件不含任何真实密码，全部通过 ${环境变量:默认值} 注入。
  #   本地开发：把 application-local.yml.example 复制成 application-local.yml，
  #             填入自己的数据库 / Redis 密码。该文件已在 .gitignore 中，不会被提交。
  #   服务器部署：直接导出 MYSQL_PASSWORD / REDIS_PASSWORD 等环境变量即可，
  #             连配置文件都不用改（Docker / CI 场景常用）。
  # ===================================================================
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ---------------- 数据源 ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:pet_service}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      connection-timeout: 30000

  # ---------------- Redis ----------------
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# ---------------- MyBatis ----------------
mybatis:
  mapper-locations: classpath:mapper/*.xml      # XML 放 resources/mapper 下
  type-aliases-package: com.petcare.entity      # XML 里可直接写 User 而不用全限定名
  configuration:
    map-underscore-to-camel-case: true          # create_time -> createTime 自动映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL，调试神器；上线要关

# ---------------- 业务自定义配置 ----------------
pet:
  order:
    timeout-minutes: 30          # 待接单超时时间(分钟)，定时任务据此计算 expire_time
  cache:
    hot-service-seconds: 600      # 热门服务缓存 10 分钟
    service-detail-seconds: 1800  # 服务详情缓存 30 分钟
    stats-seconds: 60             # 看板数据缓存 60 秒
  # 限流的次数/窗口写在 OrderService 的 @RateLimit 注解上（注解值必须是编译期常量）

logging:
  level:
    com.petcare: debug
    org.springframework.web: info
